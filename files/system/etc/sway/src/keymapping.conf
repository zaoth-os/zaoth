# This file serves solely for keymap linking.
# This file should not be modified to avoid key conflict issues or missing settings.
# For further details, consult the official documentation at $SWAYDIR/docs.

# KEYBIND SET FILE
include ./bind/keys/*.sk
include ./bind/maps/*.sv

# MAIN INTERNAL WINDOW BIND
bindsym {

        # Change window focus: left, right, up or down relative.
        $window_focus_left      $DEFAULT_FOCUS_LEFT
        $window_focus_right     $DEFAULT_FOCUS_RIGHT
        $window_focus_down      $DEFAULT_FOCUS_DOWN
        $window_focus_up        $DEFAULT_FOCUS_UP

        # Move focused window to: left, right, up or down relative.
        $window_move_to_left    $DEFAULT_MOVE_LEFT
        $window_move_to_right   $DEFAULT_MOVE_RIGHT
        $window_move_to_down    $DEFAULT_MOVE_DOWN
        $window_move_to_up      $DEFAULT_MOVE_UP

        # Grow and Shrink Width/Height of focused window.
        $window_grow_width      $DEFAULT_GROW_WIDTH
        $window_grow_height     $DEFAULT_GROW_HEIGHT
        $window_shrink_width    $DEFAULT_SHRINK_WIDTH
        $window_shrink_height   $DEFAULT_SHRINK_HEIGHT

        # Minimize(scratchpad), kill, maximize(from scratchpad), fullscreen or toggle floating
        # for focused window
        $window_to_scratch      $DEFAULT_TO_SCRATCH
        $window_to_kill         $DEFAULT_TO_KILL
        $window_show_scratch    $DEFAULT_SHOW_SCRATCH
        $window_to_fullscreen   $DEFAULT_TO_FULLSCREEN
        $window_toggle_float    $DEFAULT_TOGGLE_FLOAT


        # Alternate between window modes: stabbed, stacking or toggle split
        $window_mode_toggle     $DEFAULT_TOGGLE_MODE

        # Select split direction for split mode.
        $window_split_toggle    $DEFAULT_TOGGLE_SPLIT
}

# CORE EXEC BIND
bindsym {

        $call_total_reload              $DEFAULT_RELOAD
        $call_default_term              $DEFAULT_TERM
        $call_default_browser           $DEFAULT_BROWSER
        $call_default_menu              $DEFAULT_MENU
		$call_default_files 			$DEFAULT_FILES
		$call_default_wallpaper			$DEFAULT_WALLPAPER

        $system_raise_volume            $DEFAULT_VOLUME_RAISE
        $system_lower_volume            $DEFAULT_VOLUME_LOWER
        $system_mute_volume             $DEFAULT_VOLUME_MUTE

        $system_display_light_raise     $DEFAULT_LIGHT_RAISE
        $system_display_light_lower     $DEFAULT_LIGHT_LOWER
        $system_power_options_call      $DEFAULT_POWER_OFF
        $system_full_lock               $DEFAULT_LOCKSCREEN
}


# PRINT OPTION BIND
bindsym {
        $print_mode_norm                 $DEFAULT_PRINT_NORM
        $print_mode_region               $DEFAULT_PRINT_REGION
}


