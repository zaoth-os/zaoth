# MAIN WORKSPACE INTERNAL BIND
bindsym {
        # Go to N workspace.
        $go_to_workspace_1  $WS_1
        $go_to_workspace_2  $WS_2
        $go_to_workspace_3  $WS_3
        $go_to_workspace_4  $WS_4
        $go_to_workspace_5  $WS_5
        $go_to_workspace_6  $WS_6
        $go_to_workspace_7  $WS_7
        $go_to_workspace_8  $WS_8
        $go_to_workspace_9  $WS_9
        $go_to_workspace_10 $WS_10

        # Move focused window to N workspace.
        $move_window_to_workspace_1     $MOVE_WIN_TO_1
        $move_window_to_workspace_2     $MOVE_WIN_TO_2
        $move_window_to_workspace_3     $MOVE_WIN_TO_3
        $move_window_to_workspace_4     $MOVE_WIN_TO_4
        $move_window_to_workspace_5     $MOVE_WIN_TO_5
        $move_window_to_workspace_6     $MOVE_WIN_TO_6
        $move_window_to_workspace_7     $MOVE_WIN_TO_7
        $move_window_to_workspace_8     $MOVE_WIN_TO_9
        $move_window_to_workspace_10    $MOVE_WIN_TO_10

        # Move focused window and go to N workspace.
        $move_window_and_focus_to_workspace_1   $MOVE_AND_FOCUS_TO_1
        $move_window_and_focus_to_workspace_2   $MOVE_AND_FOCUS_TO_2
        $move_window_and_focus_to_workspace_3   $MOVE_AND_FOCUS_TO_3
        $move_window_and_focus_to_workspace_4   $MOVE_AND_FOCUS_TO_4
        $move_window_and_focus_to_workspace_5   $MOVE_AND_FOCUS_TO_5
        $move_window_and_focus_to_workspace_6   $MOVE_AND_FOCUS_TO_6
        $move_window_and_focus_to_workspace_7   $MOVE_AND_FOCUS_TO_7
        $move_window_and_focus_to_workspace_8   $MOVE_AND_FOCUS_TO_8
        $move_window_and_focus_to_workspace_9   $MOVE_AND_FOCUS_TO_9
        $move_window_and_focus_to_workspace_10  $MOVE_AND_FOCUS_TO_10
}
