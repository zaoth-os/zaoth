# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:

    - type: dnf
      install:
        install-weak-deps: false
        packages:
          - libopenjph
          - heif-pixbuf-loader
          - ffmpegthumbnailer
          - rar
          - pipewire-libs-extra

      replace:
        - from-repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - libheif
            - libva
            - mesa-dri-drivers
            - gstreamer1-plugin-libav
            - mesa-filesystem
            - mesa-libEGL
            - mesa-libGL
            - mesa-libgbm
            - mesa-vulkan-drivers
            - libva-intel-media-driver
            - intel-gmmlib
            - intel-mediasdk
            - old: ffmpeg-free
              new: ffmpeg
            - old: fdk-aac-free
              new: libfdk-aac
            - old: gstreamer1-plugins-ugly-free
              new: gstreamer1-plugins-ugly
            - old: libavcodec-free
              new: libavcodec
            - old: libavdevice-free
              new: libavdevice
            - old: libavfilter-free
              new: libavfilter
            - old: libavformat-free
              new: libavformat
            - old: libavutil-free
              new: libavutil
            - old: libpostproc-free
              new: libpostproc
            - old: libswresample-free
              new: libswresample
            - old: libswscale-free
              new: libswscale

    - type: dnf
      install:
        install-weak-deps: false
        packages:
          - repo: fedora-multimedia
            packages:
              - mesa-va-drivers
