# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: zaoth
description: Zaoth is a minimalist and purist image for Fedora Atomic.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - install_bashlib.sh
      - install_sharefile.sh

  - type: dnf
    repos:
      copr:
        #- swayfx/swayfx
        - tofik/nwg-shell
        #- lihaohong/yazi
        - che/zed
        - zeno/scrcpy
        - atim/nushell

    install:
      - install-weak-deps: false
        packages:
          #Core Dev & Container Stack
          - git
          - podman-compose
          - podman
          - openssh-clients
          - cronie
          - gum
          - scrcpy
          - android-tools
          - nushell
          - meson
          - ninja-build
          - pkgconf-pkg-config
          - cairo-devel
          - pango-devel
          - wayland-devel
          - wayland-protocols-devel
          - libxkbcommon-devel
          - scdoc
          
          # Terminal & CLI
          - sddm-themes
          - sddm
          - grim
          - slurp
          - Thunar
          - ranger
          - dunst
          - micro
          - btop
          - fzf
          - chafa
          - bat
          - ImageMagick
          - ffmpegthumbnailer
          - poppler-utils
          - 7zip
          - i3blocks
    
    
          # Window Manager & Display Server
          - sway
          - nwg-look
          - gtklock
          - dialog
          - zenity
    
    
          # Visual & GUI Apps
          - steam
          - zed
          - gimp
          - inkscape
          - godot
          - falkon
    
          # Core LXQt
          - lxqt-policykit
    
          # Network & Hardware Management
          - NetworkManager-wifi
          - iw
          - bluez
          - pamixer
          - brightnessctl

  # Last Custom Scripts
  - type: script
    scripts:
      - greeter_dm.sh

  # Initramfs rebuild
  - type: initramfs
