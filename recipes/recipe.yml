# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: zaoth
description: Zaoth is a minimalist and purist image for Fedora Atomic.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - from-file: submodules/initialize.yml
  - from-file: submodules/repositories.yml
  - from-file: submodules/terminal_utils.yml
  - from-file: submodules/devel_utils.yml
  - from-file: submodules/desktop_apps.yml
  - from-file: submodules/devices_setup.yml
  - from-file: submodules/proprietary_drivers.yml
  - from-file: submodules/greetd_setup.yml
  - from-file: submodules/sway_setup.yml
  - from-file: submodules/finish.yml
